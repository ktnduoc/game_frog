<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Face -->
  <ellipse cx="32" cy="36" rx="26" ry="22" fill="#4ade80"/>
  <ellipse cx="32" cy="38" rx="22" ry="18" fill="#22c55e"/>

  <!-- Eyes bulge -->
  <circle cx="18" cy="18" r="14" fill="#4ade80"/>
  <circle cx="46" cy="18" r="14" fill="#4ade80"/>

  <!-- Eye whites -->
  <circle cx="18" cy="18" r="10" fill="#fff"/>
  <circle cx="46" cy="18" r="10" fill="#fff"/>

  <!-- Pupils -->
  <circle cx="20" cy="18" r="5" fill="#1a1a1a"/>
  <circle cx="48" cy="18" r="5" fill="#1a1a1a"/>

  <!-- Eye shine -->
  <circle cx="17" cy="15" r="2.5" fill="#fff"/>
  <circle cx="45" cy="15" r="2.5" fill="#fff"/>

  <!-- Blush -->
  <ellipse cx="12" cy="36" rx="5" ry="3" fill="#fca5a5" opacity="0.6"/>
  <ellipse cx="52" cy="36" rx="5" ry="3" fill="#fca5a5" opacity="0.6"/>

  <!-- Nostrils -->
  <circle cx="26" cy="38" r="2" fill="#166534"/>
  <circle cx="38" cy="38" r="2" fill="#166534"/>

  <!-- Smile -->
  <path d="M 20 46 Q 32 54 44 46" stroke="#166534" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
